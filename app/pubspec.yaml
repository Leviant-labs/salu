name: salu
description: Salu - local-first nutrition tracking, planning and coaching.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.0.3
  file_picker: ^10.3.3
  flutter_secure_storage: ^9.2.4
  drift: ">=2.20.0 <3.0.0"
  drift_flutter: ">=0.2.0 <0.5.0"
  flutter_riverpod: ">=2.6.1 <3.0.0"
  go_router: ">=14.0.0 <17.0.0"
  salu_core:
    path: ../packages/salu_core
  http: ^1.6.0
  url_launcher: ^6.3.2
  jose: ^0.3.5+2
  crypto: ^3.0.7
  salu_data:
    path: ../packages/salu_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    # Exact official INSA BDCA 7.1-2026 workbook, pinned by SHA-256 in the
    # salu_data INSA adapter. Bundled only for this private family-testing
    # build; no redistribution permission is claimed.
    - assets/catalogue/insa_tca_7.1_2026.xlsx
    - assets/meals/starter_meals_v1.json
