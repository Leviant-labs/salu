name: salu
description: Salu - local-first nutrition tracking, planning and coaching.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  crypto: ^3.0.6
  drift: ">=2.20.0 <3.0.0"
  drift_flutter: ">=0.2.0 <0.5.0"
  flutter_riverpod: ">=2.6.1 <3.0.0"
  flutter_secure_storage: ^9.2.4
  go_router: ">=14.0.0 <17.0.0"
  image_picker: ^1.1.2
  jose: ^0.3.5
  mobile_scanner: ^6.0.11
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  salu_core:
    path: ../packages/salu_core
  salu_data:
    path: ../packages/salu_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
