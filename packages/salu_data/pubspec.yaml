name: salu_data
description: >
  SQLite persistence for Salu via drift: catalogue, diary entries, migrations,
  and the repository implementations of the core ports.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  drift: ^2.20.0
  salu_core:
    path: ../salu_core
  sqlite3: ^2.4.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  lints: ^5.0.0
  test: ^1.25.0
